micronaut:
  application:
    name: apiBanco
datasources:
  default:
    url: jdbc:h2:mem:devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
    dialect: H2
netty:
  default:
    allocator:
      max-order: 3
jpa:
  default:
    entity-scan:
      packages: com.api.banco
    properties:
      hibernate:
        bytecode:
          provider:
        hbm2ddl:
          auto: update
